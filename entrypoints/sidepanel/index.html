<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse Search</title>
    <style>
      html, body { margin: 0; height: 100%; background: #202124; color: #e8eaed; font-family: system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; flex: none; }
      header b { font-size: 15px; letter-spacing: 0.2px; }
      header .sp { flex: 1; }
      header button { background: none; border: 0; color: #9aa0a6; cursor: pointer; font-size: 16px; padding: 6px; border-radius: 6px; }
      header button:hover { background: #3c4043; color: #e8eaed; }
      #banner { display: flex; align-items: center; gap: 10px; margin: 0 12px 8px; padding: 8px 12px; border-radius: 8px; background: #4a3b12; color: #fde293; font-size: 13px; flex: none; }
      #banner[hidden] { display: none; }
      #banner button { margin-left: auto; background: #fde293; color: #202124; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; }
      #status { padding: 24px 16px; color: #9aa0a6; font-size: 14px; }
      #status.error { color: #f28b82; }
      #status pre { white-space: pre-wrap; font-size: 11px; opacity: 0.8; }
      #resultsView { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      #resultsView[hidden], #history[hidden], [hidden] { display: none !important; }
      body.hist #open { display: none; }
      #history { flex: 1; overflow: auto; padding: 0 12px 16px; }
      #history .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; font-size: 12px; color: #9aa0a6; }
      #history select, #history button { background: #303134; color: #e8eaed; border: 1px solid #4a4d51; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
      #history button:hover { background: #3c4043; }
      #history input[type=range] { vertical-align: middle; width: 90px; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .card { background: #2a2b2e; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
      .card img { width: 100%; height: 120px; object-fit: contain; background: #17181a; border-radius: 4px; cursor: zoom-in; }
      .card .meta { font-size: 11px; color: #9aa0a6; }
      .card .acts { display: flex; gap: 4px; }
      .card .acts button { flex: 1; padding: 4px 2px; font-size: 11px; }
      .card .acts button:last-child { flex: 0 0 30px; }
      #empty { color: #9aa0a6; font-size: 13px; padding: 16px 4px; }
      iframe { flex: 1; border: 0; width: 100%; background: #fff; display: none; }
    </style>
  </head>
  <body>
    <header>
      <b id="title">Yandex</b>
      <span class="sp"></span>
      <button id="open" title="Abrir en una pestaña" hidden>↗</button>
      <button id="hist" title="Historial de capturas">🕘</button>
    </header>
    <div id="resultsView">
      <div id="banner" hidden></div>
      <div id="status">Selecciona una región de la página.</div>
      <iframe id="results" name="results" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <section id="history" hidden>
      <div class="bar">
        <label>Formato
          <select id="fmt"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select>
        </label>
        <label id="qWrap">Calidad <input id="q" type="range" min="40" max="100" step="1" /> <span id="qv"></span></label>
        <label>Guardar
          <select id="max"><option>20</option><option>50</option><option>100</option><option>200</option></select>
        </label>
        <label>Página completa
          <select id="method"><option value="scroll">Desplazar y unir</option><option value="debugger">Una captura (depurador)</option></select>
        </label>
        <button id="clear">Borrar todo</button>
      </div>
      <div id="grid"></div>
      <p id="empty" hidden>Aún no hay capturas. Usa Alt+Shift+C (región) o Alt+Shift+F (página completa).</p>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
